# Grafana dashboard provisioning — loads JSON from disk on every start.
# "No hand-clicked dashboards that vanish on container rebuild." (config-as-code)
apiVersion: 1

providers:
  - name: ailedger-detection
    orgId: 1
    folder: AILedger / Lodestar
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
